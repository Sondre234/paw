general {
    gaps_in = 3
    gaps_out = 5 10 5 10
    border_size = 2
    allow_tearing = true
    col.active_border = $accent rgba(00ff99ee) 45deg
    col.inactive_border = 0xaa595959
}
decoration {
    rounding = 8
    active_opacity = 0.95
    blur {
        enabled = true
        size = 4
    }
}
animations {
    enabled = no
}
misc {
    focus_on_activate = true
}
