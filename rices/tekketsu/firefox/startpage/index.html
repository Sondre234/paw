<!doctype html>
<!--
  tekketsu start page: paw's tekketsu rice for Firefox. The rice's wallpaper behind black glass,
  a summoning circle drawn faintly in blood turning slowly behind the clock and ash falling past
  it: a clock whose colon beats like a heart, the date and a line of Japanese, a search card that
  asks DuckDuckGo (or opens an address) with the elf mage sitting on its edge, and eight riveted
  iron link cards. Pat her and her wings flick and the circle's marks flare; click the dark and a
  small circle is drawn where you clicked.
  No network requests and no build step: open it as a file.
  Keys: "/" focuses search, 1-8 open the cards, Esc leaves the search box, Shift shows the numbers.
  Edit the links below; the greeting's name and the search engine are at the top of app.js.
  SPDX-License-Identifier: GPL-3.0-or-later
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>new tab</title>
  <link rel="icon" href="tekketsu.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- a thorn: a cross of four spikes, the lower one longest, between the weekday and the date -->
      <symbol id="thorn" viewBox="0 0 24 24">
        <path d="M12 0L13.3 8.6L20.5 10.8L13.3 13L12 24L10.7 13L3.5 10.8L10.7 8.6Z"/>
      </symbol>
      <!-- one paw print: four toe beans and a pad, for paw's own card -->
      <symbol id="print" viewBox="44 49 168 168">
        <ellipse cx="70" cy="110" rx="18.8" ry="22.8" transform="rotate(-28 70 110)"/>
        <ellipse cx="106" cy="80" rx="20.1" ry="24.1" transform="rotate(-10 106 80)"/>
        <ellipse cx="150" cy="80" rx="20.1" ry="24.1" transform="rotate(10 150 80)"/>
        <ellipse cx="186" cy="110" rx="18.8" ry="22.8" transform="rotate(28 186 110)"/>
        <path d="M128 128C153 128 175 151 176 176C177 195 170 207 160 207C152 207 149 200 144 200C139 200 138 210 128 210C118 210 117 200 112 200C107 200 104 207 96 207C86 207 79 195 80 176C81 151 103 128 128 128Z"/>
      </symbol>
      <!-- the circle's marks: eight made-up glyphs of straight strokes, no alphabet's letters,
           set round its rim by app.js -->
      <symbol id="rune0" viewBox="0 0 10 14"><path d="M5 1V13M1 4L9 10"/></symbol>
      <symbol id="rune1" viewBox="0 0 10 14"><path d="M2 1V13L8 9L2 5"/></symbol>
      <symbol id="rune2" viewBox="0 0 10 14"><path d="M1 13L5 1L9 13M5 1V7"/></symbol>
      <symbol id="rune3" viewBox="0 0 10 14"><path d="M2 2L8 6L2 10L8 13"/></symbol>
      <symbol id="rune4" viewBox="0 0 10 14"><path d="M1 7L5 1L9 7L5 13ZM5 4V10"/></symbol>
      <symbol id="rune5" viewBox="0 0 10 14"><path d="M2 1H8M5 1V13M2 13L8 9"/></symbol>
      <symbol id="rune6" viewBox="0 0 10 14"><path d="M2 13V3L5 1L8 3M5 6L8 13"/></symbol>
      <symbol id="rune7" viewBox="0 0 10 14"><path d="M1 1L9 13M9 1L5 7M3 10L1 13"/></symbol>
    </defs>
  </svg>

  <!-- the summoning circle, faint and turning slowly behind the clock; its rim of marks is set
       by app.js, and flares when something stirs -->
  <svg class="circle" id="circle" viewBox="-100 -100 200 200" aria-hidden="true" focusable="false">
    <g class="circle-rim">
      <circle r="97" class="hair"/>
      <circle r="93"/>
      <g class="runes" id="runes"></g>
      <circle r="79"/>
    </g>
    <g class="circle-star">
      <path d="M0 -79L46.4 63.9L-75.1 -24.4H75.1L-46.4 63.9Z"/>
      <circle r="30.2" class="hair"/>
    </g>
    <g class="circle-heart">
      <circle r="26" class="ticks"/>
      <circle r="21" class="hair"/>
    </g>
  </svg>

  <!-- ash falling over the wallpaper, behind the glass, a few cinders in it (app.js) -->
  <canvas class="ash" id="ash" aria-hidden="true"></canvas>

  <header class="masthead">
    <a class="mark" href="https://github.com/Sondre234/paw" title="paw">
      <img class="mark-face" src="tekketsu.svg" alt="">
      <span class="mark-kanji" lang="ja">鉄血</span>
      <span class="mark-name">Tekketsu</span>
      <span class="mark-sub">for paw</span>
    </a>
    <p class="almanac glass" id="almanac"></p>
  </header>

  <main class="sheet">
    <p class="greeting" id="greeting">hello.</p>
    <h1 class="clock" id="clock" aria-live="off"><span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span></h1>
    <p class="date" id="date"></p>
    <p class="wa" id="wa" lang="ja"></p>

    <form class="search glass" id="search" action="https://duckduckgo.com/" method="get" role="search" autocomplete="off">
      <!-- the elf mage sits on the search card's edge, her legs hanging over its front; pat her -->
      <button class="mascot" id="mascot" type="button" title="pat her" aria-label="pat the elf mage">
        <img class="mascot-body" id="mascot-picture" src="mascot.png" alt="" draggable="false">
        <img class="wing wing-left" src="mascot.png" alt="" draggable="false" aria-hidden="true">
        <img class="wing wing-right" src="mascot.png" alt="" draggable="false" aria-hidden="true">
        <span class="mascot-hit" aria-hidden="true"></span>
        <span class="says glass" id="says" aria-hidden="true"></span>
      </button>
      <img class="search-sigil" src="tekketsu.svg" alt="">
      <input id="q" name="q" type="text" placeholder="search the web, or type an address"
             aria-label="Search DuckDuckGo" spellcheck="false" autofocus>
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <button class="search-go" type="submit">search</button>
    </form>

    <nav class="cards" id="cards" aria-label="Links">
      <a class="card glass" href="https://github.com/" style="--accent: var(--text)">
        <span class="chip">gh</span>
        <span class="card-text"><span class="card-name">GitHub</span><span class="card-url">github.com</span></span>
        <kbd>1</kbd>
      </a>
      <a class="card glass" href="https://www.reddit.com/r/unixporn/" style="--accent: var(--crimson)">
        <span class="chip">r/</span>
        <span class="card-text"><span class="card-name">r/unixporn</span><span class="card-url">reddit.com</span></span>
        <kbd>2</kbd>
      </a>
      <a class="card glass" href="https://wiki.archlinux.org/" style="--accent: var(--frost)">
        <span class="chip">aw</span>
        <span class="card-text"><span class="card-name">Arch Wiki</span><span class="card-url">archlinux.org</span></span>
        <kbd>3</kbd>
      </a>
      <a class="card glass" href="https://github.com/Sondre234/paw/tree/main/docs" style="--accent: var(--parchment)">
        <span class="chip"><svg aria-hidden="true"><use href="#print"/></svg></span>
        <span class="card-text"><span class="card-name">paw docs</span><span class="card-url">github.com/…/paw</span></span>
        <kbd>4</kbd>
      </a>
      <a class="card glass" href="https://www.youtube.com/" style="--accent: var(--ichor)">
        <span class="chip">yt</span>
        <span class="card-text"><span class="card-name">YouTube</span><span class="card-url">youtube.com</span></span>
        <kbd>5</kbd>
      </a>
      <a class="card glass" href="https://mail.google.com/" style="--accent: var(--steel)">
        <span class="chip">@</span>
        <span class="card-text"><span class="card-name">Mail</span><span class="card-url">mail.google.com</span></span>
        <kbd>6</kbd>
      </a>
      <a class="card glass" href="https://news.ycombinator.com/" style="--accent: var(--brass)">
        <span class="chip">hn</span>
        <span class="card-text"><span class="card-name">Hacker News</span><span class="card-url">ycombinator.com</span></span>
        <kbd>7</kbd>
      </a>
      <a class="card glass" href="https://jisho.org/" style="--accent: var(--elf)">
        <span class="chip">ji</span>
        <span class="card-text"><span class="card-name">jisho</span><span class="card-url">jisho.org</span></span>
        <kbd>8</kbd>
      </a>
    </nav>
  </main>

  <footer class="colophon">
    <img src="tekketsu.svg" alt="">
    <span><span lang="ja">鉄血</span> · iron and blood</span>
  </footer>

  <!-- the small circles a click draws, and the motes they give off, in front of everything (app.js) -->
  <canvas class="sigils" id="sigils" aria-hidden="true"></canvas>
  <script src="app.js"></script>
</body>
</html>
