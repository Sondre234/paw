# tekketsu (鉄血) for kitty: black-iron glass with the cracked dark behind it, bone text, a
# blood-red cursor smearing a trail of gore, and the current tab marked in blood under a skull.
# Colours and the rest are paw's, GPL-3.0-or-later. Include it from kitty.conf
# (`include tekketsu.conf`), or let install.sh do that.

font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
font_size        12
modify_font      cell_height 110%
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
single_window_padding_width 18 24
confirm_os_window_close 0
enable_audio_bell    no

# Glass: black iron that lets the wallpaper through, and paw blurs what shows (kitty also asks
# for blur itself where a compositor offers the background-blur protocol). The colours below are
# the backgrounds tekketsu's Neovim and Helix themes paint (mantle under floats and the status
# line, the cursor line, surface1 and surface2 under folds and the selected row of a menu, the
# selection and Helix's other selections), kept glass too instead of turning into opaque slabs;
# the cursor line no clearer than the glass around it, or it fades into a bright wallpaper. The
# base itself is left out: listed, it draws the text area a shade clearer than the padding
# around it.
background_opacity   0.8
background_blur      32
transparent_background_colors #0B0A0A@0.88 #1E1A1A@0.8 #231F1F@0.9 #2F2929@0.9 #3C1714@0.92 #2A1312@0.92

# A blood-red cursor, and behind it a smear of gore as it moves.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.06 0.28
cursor_trail_start_threshold 2 1
cursor_shape_unfocused hollow
cursor_trail_color   #6E1712

foreground           #E4DBC4
background           #100E0E
# a dried-blood wash under the selected text, which keeps its own colours
selection_foreground none
selection_background #3C1714
cursor               #C42B23
cursor_text_color    #E4DBC4
url_color            #9CB2C9
url_style            straight
undercurl_style      thin-sparse
active_border_color   #C42B23
inactive_border_color #2F2929
bell_border_color     #E5483D
mark1_foreground      #E4DBC4
mark1_background      #C42B23
mark2_foreground      #100E0E
mark2_background      #CFA772
mark3_foreground      #100E0E
mark3_background      #A196AD

# A thin scrollbar in overlay, showing only while scrolling or hovered.
scrollbar                scrolled-and-hovered
scrollbar_width          0.4
scrollbar_hover_width    0.8
scrollbar_radius         0.1
scrollbar_handle_color   #8E827D
scrollbar_handle_opacity 0.5
scrollbar_track_opacity  0

# Iron tabs on the glass; the current one in blood, a skull on it.
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_bar_background     none
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  󰚌 {title}  "
active_tab_foreground  #E4DBC4
active_tab_background  #C42B23
active_tab_font_style  bold
inactive_tab_foreground #AB9F90
inactive_tab_background #231F1F
inactive_tab_font_style normal

# The sixteen colours: iron, blood (crimson, and ichor where it is bright), the elf's green eyes,
# brass, frost, the violet gunmetal of the mechanical arms, verdigris on old iron, and bone; the
# bright ones a touch paler.
color0  #231F1F
color8  #6B605E
color1  #E5483D
color9  #FF6A5C
color2  #A7B98C
color10 #BCCDA2
color3  #CFA772
color11 #E6DEB1
color4  #9CB2C9
color12 #B6C8DA
color5  #A196AD
color13 #BCB1C7
color6  #8FADA5
color14 #AAC6BE
color7  #CBBFA8
color15 #E4DBC4
