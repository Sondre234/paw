# hibana (火花) for kitty: ink-grey glass with rain behind it, paper-white text, an ember cursor
# throwing a blood-red trail, and a fire on the current tab. Colours and the rest are paw's,
# GPL-3.0-or-later. Include it from kitty.conf (`include hibana.conf`), or let install.sh do that.

font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
font_size        12
modify_font      cell_height 110%
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
single_window_padding_width 18 24
confirm_os_window_close 0
enable_audio_bell    no

# Glass: the ink lets the wallpaper through, and paw blurs what shows (kitty also asks for blur
# itself where a compositor offers the background-blur protocol), rain on a window. The colours
# below are the backgrounds hibana's Neovim and Helix themes paint (mantle under floats and the
# status line, the cursor line, surface1 and surface2 under folds and the selected row of a menu,
# the selection and Helix's other selections), kept glass too instead of turning into opaque
# slabs; the cursor line no clearer than the glass around it, or it fades into a bright
# wallpaper. The base itself is left out: listed, it draws the text area a shade clearer than the
# padding around it.
background_opacity   0.8
background_blur      32
transparent_background_colors #111013@0.88 #232126@0.8 #2A272E@0.9 #36323A@0.9 #3D2B26@0.92 #2D2220@0.92

# An ember cursor, its trail blood red: a spark and the streak it leaves.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.06 0.28
cursor_trail_start_threshold 2 1
cursor_shape_unfocused hollow
cursor_trail_color   #C8443C

foreground           #E2DDD9
background           #161518
# a smoky ember wash under the selected text, which keeps its own colours
selection_foreground none
selection_background #3D2B26
cursor               #FF7A33
cursor_text_color    #161518
url_color            #9FB3CC
url_style            straight
undercurl_style      thin-sparse
active_border_color   #FF7A33
inactive_border_color #36323A
bell_border_color     #E5594D
mark1_foreground      #161518
mark1_background      #FF7A33
mark2_foreground      #161518
mark2_background      #FFB070
mark3_foreground      #161518
mark3_background      #8FB0B4

# A thin scrollbar in overlay, showing only while scrolling or hovered.
scrollbar                scrolled-and-hovered
scrollbar_width          0.4
scrollbar_hover_width    0.8
scrollbar_radius         0.1
scrollbar_handle_color   #8F8A94
scrollbar_handle_opacity 0.5
scrollbar_track_opacity  0

# Quiet ash tabs on the glass; the current one in ember, with a fire burning on it.
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_bar_background     none
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  󰈸 {title}  "
active_tab_foreground  #0B0A0D
active_tab_background  #FF7A33
active_tab_font_style  bold
inactive_tab_foreground #A8A3AB
inactive_tab_background #2A272E
inactive_tab_font_style normal

# The sixteen colours: ash, a muted blood red, sage, amber (which carries the ember into the
# terminal), rain blue, the storm's mauve, the statue's steel and paper; the bright ones a touch
# hotter.
color0  #2A272E
color8  #4B4650
color1  #D9564A
color9  #EF6E60
color2  #A3B58F
color10 #B9CBA3
color3  #F0A65A
color11 #FFBF80
color4  #8FA9C4
color12 #A9C1D9
color5  #B39AAE
color13 #CBB2C6
color6  #8FB0B4
color14 #A8C9CC
color7  #C6C1C6
color15 #E2DDD9
