# mochi (餅) for kitty: Catppuccin Mocha under frosted glass, a pink cursor with a periwinkle
# trail, quiet tabs with a cat on the current one. Colours from Catppuccin Mocha, MIT
# (https://github.com/catppuccin/catppuccin); the rest is paw's, GPL-3.0-or-later.
# Include it from kitty.conf (`include mochi.conf`), or let install.sh do that.

font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
font_size        12.5
modify_font      cell_height 112%
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
single_window_padding_width 18 24
confirm_os_window_close 0
enable_audio_bell    no

# Frosted glass: the base lets the wallpaper through, and paw blurs what shows (kitty also asks
# for blur itself where a compositor offers the background-blur protocol). The colours below are
# the backgrounds mochi's Neovim and Helix themes and Catppuccin's other ports paint, so floats,
# the cursor line and status lines stay glass too instead of turning into opaque slabs.
background_opacity   0.84
background_blur      32
transparent_background_colors #1E1E2E #181825@0.88 #2A2B3C@0.86 #313244@0.9

# A pink cursor, its trail in periwinkle: the two pastels, side by side.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.08 0.32
cursor_trail_start_threshold 2 1
cursor_shape_unfocused hollow
cursor_trail_color   #B4BEFE

foreground           #CDD6F4
background           #1E1E2E
# a pink wash under the selected text, which keeps its own colours
selection_foreground none
selection_background #4D4257
cursor               #F5C2E7
cursor_text_color    #1E1E2E
url_color            #89B4FA
url_style            curly
undercurl_style      thick-sparse
active_border_color   #CBA6F7
inactive_border_color #45475A
bell_border_color     #F9E2AF
mark1_foreground      #1E1E2E
mark1_background      #B4BEFE
mark2_foreground      #1E1E2E
mark2_background      #CBA6F7
mark3_foreground      #1E1E2E
mark3_background      #74C7EC

# A thin scrollbar in overlay, showing only while scrolling or hovered.
scrollbar                scrolled-and-hovered
scrollbar_width          0.4
scrollbar_hover_width    0.8
scrollbar_radius         0.2
scrollbar_handle_color   #9399B2
scrollbar_handle_opacity 0.55
scrollbar_track_opacity  0

# Quiet pills on the glass; the current tab in mauve, with a cat sitting on it.
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_bar_background     none
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  󰄛 {title}  "
active_tab_foreground  #11111B
active_tab_background  #CBA6F7
active_tab_font_style  bold
inactive_tab_foreground #A6ADC8
inactive_tab_background #313244
inactive_tab_font_style normal

# The sixteen colours as Catppuccin's own kitty port has them: surface, red, green, yellow,
# blue, pink, teal and subtext; the bright ones a touch more vivid.
color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F37799
color2  #A6E3A1
color10 #89D88B
color3  #F9E2AF
color11 #EBD391
color4  #89B4FA
color12 #74A8FC
color5  #F5C2E7
color13 #F2AEDE
color6  #94E2D5
color14 #6BD7CA
color7  #BAC2DE
color15 #A6ADC8
