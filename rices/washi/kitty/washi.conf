# washi (和紙) for kitty: ink on cream paper, caramel and a vermilion seal.
# Include it from kitty.conf (`include washi.conf`), or let install.sh do that.

font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
font_size        12.5
# A little more air between lines, as print has.
modify_font      cell_height 112%
# Nerd Font icons (fastfetch, prompts, file managers) from the symbols-only font.
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
background_opacity   1.0
confirm_os_window_close 0
enable_audio_bell    no

# The cursor drags a vermilion trail behind it, like a brush lifting off.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.08 0.32
cursor_trail_start_threshold 2
cursor_trail_color   #B03A2E

foreground           #2B221C
background           #FBF7EF
selection_foreground #2B221C
selection_background #EBDCC4
cursor               #2B221C
cursor_text_color    #FBF7EF
url_color            #2D5A82
url_style            curly
active_border_color   #A87650
inactive_border_color #D6C8B2
bell_border_color     #B03A2E
mark1_background      #EBDCC4
mark2_background      #F1D3C9
mark3_background      #D9E3CC

# Tabs as ink labels on the paper: the current one inked in, the rest pencilled.
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  {fmt.fg._D9A36E}●{fmt.fg.tab} {title}  "
tab_bar_background     #FBF7EF
active_tab_foreground  #FBF7EF
active_tab_background  #2B221C
active_tab_font_style  bold
inactive_tab_foreground #7A6B5E
inactive_tab_background #EFE6D6
inactive_tab_font_style normal

# Ink, vermilion, moss, mustard, indigo, plum, teal and pencil; then their brighter washes.
color0  #2B221C
color8  #5C4F45
color1  #B03A2E
color9  #C8503D
color2  #4F6F26
color10 #66883A
color3  #8A5A0E
color11 #B0782A
color4  #2D5A82
color12 #4473A0
color5  #873C66
color13 #A3527E
color6  #276A61
color14 #3A857A
color7  #7A6B5E
color15 #FBF7EF
