# washi (和紙) for kitty: navy ink on sakura paper, light blue and pink, a rose seal.
# Include it from kitty.conf (`include washi.conf`), or let install.sh do that.

font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
font_size        12.5
# A little more air between lines, as print has.
modify_font      cell_height 112%
# Nerd Font icons (fastfetch, prompts, file managers) from the symbols-only font.
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
background_opacity   1.0
confirm_os_window_close 0
single_window_padding_width 18 24
enable_audio_bell    no

# The cursor drags a sakura trail behind it, like a brush lifting off.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.08 0.32
cursor_trail_start_threshold 2 1
cursor_shape_unfocused hollow
cursor_trail_color   #E58BAE

foreground           #363C58
background           #FBF9FB
selection_foreground #363C58
selection_background #DCEAF8
cursor               #363C58
cursor_text_color    #FBF9FB
url_color            #3570B3
url_style            curly
undercurl_style      thick-sparse
active_border_color   #8FC1EC
inactive_border_color #DAD3E0
bell_border_color     #D9608C
mark1_background      #DCEAF8
mark2_background      #F8DCE7
mark3_background      #DDEFE2

# A thin scrollbar that shows only while scrolling or hovered.
scrollbar                scrolled-and-hovered
scrollbar_width          0.4
scrollbar_hover_width    0.8
scrollbar_radius         0.2
scrollbar_handle_opacity 0.55
scrollbar_track_opacity  0

# Tabs as ink labels on the paper: the current one inked in with a sakura dot, the rest pencilled.
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  {fmt.fg._F2A0BE}●{fmt.fg.tab} {title}  "
tab_bar_background     #FBF9FB
active_tab_foreground  #FBF9FB
active_tab_background  #363C58
active_tab_font_style  bold
inactive_tab_foreground #6B708C
inactive_tab_background #EEE9F0
inactive_tab_font_style normal

# Ink, raspberry, mint, honey, sky, orchid, teal and pencil; then their brighter washes.
color0  #363C58
color8  #5A607C
color1  #B83B63
color9  #CE5A82
color2  #3F7D52
color10 #529568
color3  #9C6A12
color11 #B5832A
color4  #3570B3
color12 #4E8BCB
color5  #A2488C
color13 #B8619F
color6  #23788A
color14 #3592A3
color7  #6B708C
color15 #FBF9FB
