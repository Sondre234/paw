# sumi (墨) for kitty: washi's night, paper soaked in ink under a lamp.
# Include it from kitty.conf (`include sumi.conf`), or let install.sh do that.

font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
font_size        12.5
modify_font      cell_height 112%
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
background_opacity   0.96
confirm_os_window_close 0
single_window_padding_width 18 24
enable_audio_bell    no

# A caramel trail behind the cursor, the lamp catching it.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.08 0.32
cursor_trail_start_threshold 2 1
cursor_shape_unfocused hollow
cursor_trail_color   #D6A06E

foreground           #E8DCCB
background           #1A1613
selection_foreground #F5ECE0
selection_background #4A3A2E
cursor               #E2AE62
cursor_text_color    #1A1613
url_color            #8EA8BC
url_style            curly
undercurl_style      thick-sparse
active_border_color   #C8915F
inactive_border_color #3A302A
bell_border_color     #D96F5E
mark1_background      #4A3A2E
mark2_background      #5A2E2A
mark3_background      #36402C

# A thin scrollbar that shows only while scrolling or hovered.
scrollbar                scrolled-and-hovered
scrollbar_width          0.4
scrollbar_hover_width    0.8
scrollbar_radius         0.2
scrollbar_handle_opacity 0.55
scrollbar_track_opacity  0

tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  {fmt.fg._B03A2E}●{fmt.fg.tab} {title}  "
tab_bar_background     #1A1613
active_tab_foreground  #1A1613
active_tab_background  #D6A06E
active_tab_font_style  bold
inactive_tab_foreground #A89A88
inactive_tab_background #26201C
inactive_tab_font_style normal

# Soot, vermilion, sage, amber, slate, rose, celadon and rice paper; then lit by the lamp.
color0  #221D1A
color8  #6B5F55
color1  #D96F5E
color9  #EC8A78
color2  #A3B47A
color10 #BACB92
color3  #E2AE62
color11 #F2C784
color4  #8EA8BC
color12 #A9C1D3
color5  #C98EA4
color13 #DCA7BA
color6  #8DB8AA
color14 #A6D0C2
color7  #CDBFAD
color15 #F5ECE0
