# sumi (墨) for kitty: washi's night, paper soaked in ink by moonlight, light blue and pink.
# Include it from kitty.conf (`include sumi.conf`), or let install.sh do that.

font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
font_size        12.5
modify_font      cell_height 112%
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

window_padding_width 14 20
background_opacity   0.96
confirm_os_window_close 0
single_window_padding_width 18 24
enable_audio_bell    no

# A sakura trail behind the cursor, the moon catching it.
cursor_shape         block
cursor_blink_interval 0
cursor_trail         3
cursor_trail_decay   0.08 0.32
cursor_trail_start_threshold 2 1
cursor_shape_unfocused hollow
cursor_trail_color   #F2A7C3

foreground           #E2E0EE
background           #181722
selection_foreground #F3F1F9
selection_background #2E3A55
cursor               #8FC1EC
cursor_text_color    #181722
url_color            #8FC1EC
url_style            curly
undercurl_style      thick-sparse
active_border_color   #8FC1EC
inactive_border_color #34334A
bell_border_color     #E8789F
mark1_background      #2E3A55
mark2_background      #4A2F42
mark3_background      #2D4239

# A thin scrollbar that shows only while scrolling or hovered.
scrollbar                scrolled-and-hovered
scrollbar_width          0.4
scrollbar_hover_width    0.8
scrollbar_radius         0.2
scrollbar_handle_opacity 0.55
scrollbar_track_opacity  0

tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " "
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_min_tabs       2
tab_title_template     "  {index} · {title}  "
active_tab_title_template "  {fmt.fg._B8467A}●{fmt.fg.tab} {title}  "
tab_bar_background     #181722
active_tab_foreground  #181722
active_tab_background  #8FC1EC
active_tab_font_style  bold
inactive_tab_foreground #9D9BB4
inactive_tab_background #24232F
inactive_tab_font_style normal

# Night, rose, mint, honey, sky, orchid, teal and moonlit paper; then lit by the moon.
color0  #262533
color8  #66647F
color1  #EF7F9F
color9  #F59AB3
color2  #9FD4AB
color10 #B6E2BF
color3  #F0C27A
color11 #F6D499
color4  #8FC1EC
color12 #ACD3F4
color5  #D39CE0
color13 #E2B6EA
color6  #8CCFD2
color14 #A8DFE1
color7  #B8B6CC
color15 #F3F1F9
