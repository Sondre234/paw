# washi (和紙) for Helix: navy ink on sakura paper, light blue and pink, a rose seal.
# The light half of the washi rice; sumi.toml is the same sheet soaked in ink.
# Copy it to ~/.config/helix/themes/ and set `theme = "washi"` in config.toml.
#
# Print, not neon: ink text, comments pencilled in italic, keywords in orchid, strings in mint,
# functions in blue, types in teal, numbers in honey, the preprocessor and the accents in
# sakura, and raspberry only for the loud things (errors, escapes, jump labels). The palette at
# the bottom keeps the rice's old names (caramel, moss, ...), as the rules are shared with sumi.toml.

# Syntax ---------------------------------------------------------------------------------------
"attribute" = "caramel"

"type" = "teal"
"type.builtin" = "teal"
"type.parameter" = "teal"
"type.enum.variant" = "ochre"
"constructor" = "teal"

"constant" = "ochre"
"constant.builtin" = "ochre"
"constant.character" = "moss"
"constant.character.escape" = "seal"
"constant.numeric" = "ochre"

"string" = "moss"
"string.regexp" = "teal"
"string.special" = "caramel"
"string.special.path" = { fg = "moss", underline = { style = "line" } }
"string.special.url" = { fg = "indigo", underline = { style = "line" } }
"string.special.symbol" = "ochre"

"comment" = { fg = "muted", modifiers = ["italic"] }
"comment.unused" = { fg = "faint", modifiers = ["italic"] }

"variable" = "text"
"variable.builtin" = { fg = "plum", modifiers = ["italic"] }
"variable.parameter" = "text"
"variable.other.member" = "pencil"

"label" = "caramel"

"punctuation" = "muted"
"punctuation.delimiter" = "muted"
"punctuation.bracket" = "muted"
"punctuation.special" = "caramel"

"keyword" = "plum"
"keyword.control" = "plum"
"keyword.control.import" = "caramel"
"keyword.control.exception" = "seal"
"keyword.operator" = "plum"
"keyword.directive" = "caramel"
"keyword.function" = "plum"
"keyword.storage" = "plum"

"operator" = "caramel"

"function" = "indigo"
"function.builtin" = "indigo"
"function.method" = "indigo"
"function.macro" = "caramel"
"function.special" = "caramel"

"tag" = "plum"
"tag.builtin" = "plum"

"namespace" = "teal"
"special" = "caramel"
"embedded" = "text"

"markup.heading" = { fg = "text", modifiers = ["bold"] }
"markup.heading.marker" = "faint"
"markup.heading.1" = { fg = "seal", modifiers = ["bold"] }
"markup.heading.2" = { fg = "caramel", modifiers = ["bold"] }
"markup.heading.3" = { fg = "indigo", modifiers = ["bold"] }
"markup.heading.4" = { fg = "teal", modifiers = ["bold"] }
"markup.heading.5" = { fg = "plum", modifiers = ["bold"] }
"markup.heading.6" = { fg = "ochre", modifiers = ["bold"] }
"markup.list" = "caramel"
"markup.list.checked" = "moss"
"markup.list.unchecked" = "muted"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "muted", underline = { style = "line" } }
"markup.link.label" = "indigo"
"markup.link.text" = "indigo"
"markup.quote" = { fg = "muted", modifiers = ["italic"] }
"markup.raw" = "teal"
"markup.raw.block" = "pencil"

"diff.plus" = "moss"
"diff.minus" = "seal"
"diff.delta" = "ochre"
"diff.delta.moved" = "indigo"
"diff.delta.conflict" = "seal"

# Interface ------------------------------------------------------------------------------------
"ui.background" = { fg = "outline", bg = "sheet" }
"ui.background.separator" = "line"
"ui.text" = "text"
"ui.text.focus" = { fg = "text", bg = "fold", modifiers = ["bold"] }
"ui.text.inactive" = "muted"
"ui.text.info" = "text"
"ui.text.directory" = "indigo"
"ui.text.symlink" = "teal"

"ui.cursor" = { fg = "on_accent", bg = "pencil" }
"ui.cursor.primary" = { fg = "on_accent", bg = "cursor" }
"ui.cursor.primary.insert" = { fg = "on_accent", bg = "bean" }
"ui.cursor.primary.select" = { fg = "on_accent", bg = "indigo" }
"ui.cursor.match" = { bg = "match", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "fold" }
"ui.cursorcolumn.primary" = { bg = "fold" }

"ui.gutter.selected" = { bg = "fold" }
"ui.linenr" = "faint"
"ui.linenr.selected" = { fg = "caramel", modifiers = ["bold"] }

"ui.statusline" = { fg = "status_fg", bg = "status" }
"ui.statusline.inactive" = { fg = "muted", bg = "fold" }
"ui.statusline.normal" = { fg = "on_accent", bg = "bean", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "on_accent", bg = "moss", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "on_accent", bg = "indigo", modifiers = ["bold"] }
"ui.statusline.separator" = "faint"

"ui.bufferline" = { fg = "muted", bg = "bar" }
"ui.bufferline.active" = { fg = "tab_fg", bg = "tab", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "sheet" }

"ui.popup" = { fg = "text", bg = "raised" }
"ui.popup.info" = { fg = "text", bg = "raised" }
"ui.help" = { fg = "text", bg = "raised" }
"ui.window" = "line"
"ui.picker.header" = { bg = "bar" }
"ui.picker.header.column" = "muted"
"ui.picker.header.column.active" = { fg = "caramel", modifiers = ["bold"] }

"ui.menu" = { fg = "text", bg = "raised" }
"ui.menu.selected" = { fg = "on_accent", bg = "mark" }
"ui.menu.scroll" = { fg = "faint", bg = "bar" }

"ui.selection" = { bg = "sel2" }
"ui.selection.primary" = { bg = "sel" }
"ui.highlight" = { bg = "ref" }
"ui.highlight.frameline" = { bg = "ochre_bg" }

"ui.virtual.ruler" = { bg = "fold" }
"ui.virtual.whitespace" = "line"
"ui.virtual.indent-guide" = "line"
"ui.virtual.inlay-hint" = { fg = "faint", modifiers = ["italic"] }
"ui.virtual.wrap" = "faint"
"ui.virtual.jump-label" = { fg = "seal", modifiers = ["bold"] }

"ui.debug.breakpoint" = "seal"
"ui.debug.active" = "ochre"

"tabstop" = { bg = "ref" }

"error" = "seal"
"warning" = "ochre"
"info" = "indigo"
"hint" = "teal"
"error.diagnostic.inline" = { fg = "seal", bg = "seal_bg" }
"warning.diagnostic.inline" = { fg = "ochre", bg = "ochre_bg" }
"info.diagnostic.inline" = { fg = "indigo", bg = "indigo_bg" }
"hint.diagnostic.inline" = { fg = "teal", bg = "teal_bg" }
"diagnostic.error" = { underline = { color = "seal", style = "curl" } }
"diagnostic.warning" = { underline = { color = "ochre", style = "curl" } }
"diagnostic.info" = { underline = { color = "indigo", style = "curl" } }
"diagnostic.hint" = { underline = { color = "teal", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

rainbow = ["caramel", "indigo", "teal", "plum", "ochre", "moss"]

[palette]
sheet = "#FBF9FB"     # the paper (kitty's background)
fold = "#F3EFF5"      # cursor line: a faint fold in the paper
raised = "#F1ECF2"    # popups and menus
bar = "#EEE9F0"       # inactive buffers
sel = "#DCEAF8"       # the primary selection, sky-tinted
sel2 = "#EAF1FA"      # the other selections
ref = "#EAEFF7"       # highlighted lines
match = "#F3D6E2"     # matching bracket
line = "#DAD3E0"      # hairlines
faint = "#9EA2B8"     # line numbers
muted = "#6B708C"     # comments
pencil = "#5A607C"    # fields
text = "#363C58"      # navy ink
on_accent = "#FBF9FB" # text on ink and on sakura
status = "#363C58"    # the current window's status line, inked in like kitty's current tab
status_fg = "#FBF9FB"
tab = "#363C58"       # the current buffer
tab_fg = "#FBF9FB"
mark = "#363C58"      # the selected menu item
outline = "#4A5170"   # popup and picker borders: the 2px ink outline
cursor = "#363C58"
caramel = "#B8467A"   # the accent as text on paper: sakura, deep enough to read
bean = "#B8467A"      # the accent as a fill, under paper text
seal = "#B83B63"      # the rose hanko, deepened to raspberry for text
moss = "#3F7D52"      # mint
ochre = "#C47F00"     # honey
indigo = "#3570B3"    # blue
plum = "#A2488C"      # orchid
teal = "#23788A"
seal_bg = "#F9E1EA"   # washes of colour behind inline diagnostics
ochre_bg = "#FBF0D9"
indigo_bg = "#E3ECF8"
teal_bg = "#DFEFF1"
