<?xml version="1.0" encoding="UTF-8"?>
<!-- sumi's start button: washi's neko at night, a chibi kuroneko outlined in moonlight, with
     sakura ears and blush, glowing sky-blue anime eyes and an ω mouth. Drawn for paw,
     GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The outline: the head and ears, drawn a little past their fill. -->
  <g fill="#e2e0ee" stroke="#e2e0ee" stroke-width="6" stroke-linejoin="round">
    <polygon points="8.5,31 12.5,6.5 30,17.5"/>
    <polygon points="55.5,31 51.5,6.5 34,17.5"/>
    <ellipse cx="32" cy="38" rx="25" ry="20"/>
  </g>
  <g fill="#2a2938">
    <polygon points="8.5,31 12.5,6.5 30,17.5"/>
    <polygon points="55.5,31 51.5,6.5 34,17.5"/>
    <ellipse cx="32" cy="38" rx="25" ry="20"/>
  </g>
  <!-- Inside the ears -->
  <g fill="#f2a7c3" stroke="#f2a7c3" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="14.5,22.5 15.8,13 24,18.6"/>
    <polygon points="49.5,22.5 48.2,13 40,18.6"/>
  </g>
  <!-- Anime eyes glowing sky blue: the iris, a slit of a pupil and a glint -->
  <ellipse cx="21" cy="37" rx="4.8" ry="6" fill="#8fc1ec"/>
  <ellipse cx="43" cy="37" rx="4.8" ry="6" fill="#8fc1ec"/>
  <ellipse cx="21" cy="38.8" rx="3.4" ry="3.6" fill="#5b9ddb"/>
  <ellipse cx="43" cy="38.8" rx="3.4" ry="3.6" fill="#5b9ddb"/>
  <ellipse cx="21.4" cy="37.6" rx="1.5" ry="3.6" fill="#15141d"/>
  <ellipse cx="43.4" cy="37.6" rx="1.5" ry="3.6" fill="#15141d"/>
  <circle cx="19.2" cy="34.4" r="1.9" fill="#ffffff"/>
  <circle cx="41.2" cy="34.4" r="1.9" fill="#ffffff"/>
  <!-- Blush -->
  <ellipse cx="13.2" cy="45.5" rx="4.2" ry="2.4" fill="#f2a7c3"/>
  <ellipse cx="50.8" cy="45.5" rx="4.2" ry="2.4" fill="#f2a7c3"/>
  <!-- The ω mouth -->
  <path d="M27 44.2q2.5 3.6 5 0q2.5 3.6 5 0" fill="none" stroke="#e2e0ee" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
