<!doctype html>
<!--
  washi start page: paw's rice for Firefox. Sakura paper by day (washi), the same sheet soaked in
  ink by night (sumi), following the system's light/dark setting. A clock, the date, a search
  card that asks DuckDuckGo (or opens an address), eight stamped link cards, and the paper
  remembers where you click. No network requests and no build step: open it as a file.
  Keys: "/" focuses search, 1-8 open the cards, Esc leaves the search box.
  Edit the links below; the greeting's name and the search engine are at the top of app.js.
  SPDX-License-Identifier: GPL-3.0-or-later
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>new tab</title>
  <link rel="icon" href="seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- paw's logo beans: sakura toes and a sky-blue heel, by day and lit by the moon at night -->
      <linearGradient id="bean" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F2A0BE"/><stop offset="1" stop-color="#8FC1EC"/>
      </linearGradient>
      <linearGradient id="bean-lit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F2A7C3"/><stop offset="1" stop-color="#8FC1EC"/>
      </linearGradient>
      <!-- one print: paw's four toe beans and its pad -->
      <symbol id="print" viewBox="44 49 168 168">
        <ellipse cx="70" cy="110" rx="18.8" ry="22.8" transform="rotate(-28 70 110)"/>
        <ellipse cx="106" cy="80" rx="20.1" ry="24.1" transform="rotate(-10 106 80)"/>
        <ellipse cx="150" cy="80" rx="20.1" ry="24.1" transform="rotate(10 150 80)"/>
        <ellipse cx="186" cy="110" rx="18.8" ry="22.8" transform="rotate(28 186 110)"/>
        <path d="M128 128C153 128 175 151 176 176C177 195 170 207 160 207C152 207 149 200 144 200C139 200 138 210 128 210C118 210 117 200 112 200C107 200 104 207 96 207C86 207 79 195 80 176C81 151 103 128 128 128Z"/>
      </symbol>
      <!-- the hanko: a rounded square with the print cut out -->
      <mask id="seal-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
        <rect width="256" height="256" fill="#fff"/>
        <use href="#print" x="56" y="58" width="144" height="144" fill="#000"/>
      </mask>
      <symbol id="seal" viewBox="0 0 256 256">
        <rect x="12" y="12" width="232" height="232" rx="36" mask="url(#seal-cut)"/>
      </symbol>
    </defs>
  </svg>

  <header class="masthead">
    <a class="mark" href="https://github.com/Sondre234/paw" title="paw">
      <svg class="mark-seal" aria-hidden="true"><use href="#seal"/></svg>
      <span class="mark-name">washi</span>
      <span class="mark-sub">for paw</span>
    </a>
    <p class="almanac" id="almanac"></p>
  </header>

  <main class="sheet">
    <p class="greeting" id="greeting">hello.</p>
    <h1 class="clock" id="clock" aria-live="off"><span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span></h1>
    <p class="date" id="date"></p>

    <form class="search" id="search" action="https://duckduckgo.com/" method="get" role="search" autocomplete="off">
      <svg class="search-print" aria-hidden="true"><use href="#print"/></svg>
      <input id="q" name="q" type="text" placeholder="search the web, or type an address"
             aria-label="Search DuckDuckGo" spellcheck="false" autofocus>
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <button class="search-go" type="submit">search</button>
    </form>

    <nav class="cards" id="cards" aria-label="Links">
      <a class="card" href="https://github.com/" style="--stamp: var(--ink-stamp)">
        <span class="stamp">gh</span>
        <span class="card-text"><span class="card-name">GitHub</span><span class="card-url">github.com</span></span>
        <kbd>1</kbd>
      </a>
      <a class="card" href="https://www.reddit.com/r/unixporn/" style="--stamp: var(--seal)">
        <span class="stamp">r/</span>
        <span class="card-text"><span class="card-name">r/unixporn</span><span class="card-url">reddit.com</span></span>
        <kbd>2</kbd>
      </a>
      <a class="card" href="https://wiki.archlinux.org/" style="--stamp: var(--indigo)">
        <span class="stamp">aw</span>
        <span class="card-text"><span class="card-name">Arch Wiki</span><span class="card-url">archlinux.org</span></span>
        <kbd>3</kbd>
      </a>
      <a class="card card-paw" href="https://github.com/Sondre234/paw/tree/main/docs">
        <span class="stamp stamp-seal"><svg aria-hidden="true"><use href="#seal"/></svg></span>
        <span class="card-text"><span class="card-name">paw docs</span><span class="card-url">github.com/…/paw</span></span>
        <kbd>4</kbd>
      </a>
      <a class="card" href="https://www.youtube.com/" style="--stamp: var(--plum)">
        <span class="stamp">yt</span>
        <span class="card-text"><span class="card-name">YouTube</span><span class="card-url">youtube.com</span></span>
        <kbd>5</kbd>
      </a>
      <a class="card" href="https://mail.google.com/" style="--stamp: var(--teal)">
        <span class="stamp">@</span>
        <span class="card-text"><span class="card-name">Mail</span><span class="card-url">mail.google.com</span></span>
        <kbd>6</kbd>
      </a>
      <a class="card" href="https://news.ycombinator.com/" style="--stamp: var(--ochre)">
        <span class="stamp">hn</span>
        <span class="card-text"><span class="card-name">Hacker News</span><span class="card-url">ycombinator.com</span></span>
        <kbd>7</kbd>
      </a>
      <a class="card" href="https://jisho.org/" style="--stamp: var(--green)">
        <span class="stamp">ji</span>
        <span class="card-text"><span class="card-name">jisho</span><span class="card-url">jisho.org</span></span>
        <kbd>8</kbd>
      </a>
    </nav>
  </main>

  <footer class="colophon">
    <svg aria-hidden="true"><use href="#print"/></svg>
    <span>a cat walked across the paper</span>
  </footer>

  <div class="trail" id="trail" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
