# The shell's QML reads the C++ side through context properties (`shell`, `status`, ...) and
# creates TaskFilter from C++, so these checks cannot see the types and would only list what
# the ahead-of-time compiler and shell_ui_test already exercise.
[General]
MaxWarnings=0

[Warnings]
UnqualifiedAccess=disable
MissingProperty=disable
UnresolvedType=disable
MissingType=disable
ImportFailure=disable
IncompatibleType=disable
